    <style>
        :root { --occ:#059669; --occ-dark:#047857; --occ-light:#ecfdf5; --occ-mid:#a7f3d0; }

        body.occ-page { background:var(--surface); }

        .occ-page .top-bar { position:relative; width:100%; height:70px; margin:0; padding:0 max(28px, calc((100vw - 1540px) / 2)); gap:18px; background:var(--navy); box-shadow:0 4px 14px rgba(16,42,67,.14); }
        .occ-page .top-bar-logo { width:44px; height:44px; }
        .occ-page .top-bar-subtitle { color:#c2d2de; }
        .occ-page .top-bar-meta { margin-left:auto; color:#d5e1e9; font-weight:600; font-size:12px; white-space:nowrap; }
        .top-bar { border-bottom:4px solid var(--gold); }
        .top-bar-logo { display:block; object-fit:cover; background:white !important; }
        .top-bar-controls { margin-left:auto;display:flex;align-items:center;gap:10px; }

        .page-intro { display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px;padding:0 2px; }
        .page-intro-kicker { display:flex;align-items:center;gap:8px;color:var(--occ);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px; }
        .page-intro-kicker::before { content:"";width:25px;height:2px;background:var(--gold); }
        .page-intro h1 { font-family:'Libre Franklin',sans-serif;color:var(--navy);font-size:28px;line-height:1.2;letter-spacing:-.035em; }
        .page-intro p { color:var(--text-secondary);font-size:13px;margin-top:6px; }
        .page-note { display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:11px;font-weight:600;padding:8px 11px;border:1px solid var(--border);background:white;border-radius:8px; }
        .page-note-dot { width:7px;height:7px;border-radius:50%;background:var(--occ);box-shadow:0 0 0 3px rgba(5,150,105,.11); }

        /* Stat cards */
        .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
        .stat-card { background:var(--white); border:1px solid var(--border); border-radius:13px; padding:17px 18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow-sm); }
        .stat-icon { width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:800; flex-shrink:0; }
        .si-total{background:#eff6ff;} .si-eval{background:var(--amber-light);} .si-cleared{background:var(--occ-light);} .si-flagged{background:var(--red-light);}
        .stat-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:2px; }
        .stat-num   { font-family:'Libre Franklin',sans-serif;font-size:24px; font-weight:800; color:var(--navy); line-height:1; }

        /* Buttons */
        .btn-new-permit { padding:9px 13px; background:var(--occ); color:white; border:1px solid var(--occ); border-radius:8px; font-family:inherit;font-size:12px; font-weight:700; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:5px; transition:.2s ease; }
        .btn-new-permit:hover { background:var(--occ-dark); }
        .btn-new-permit.portal { background:transparent;color:#e7f1f7;border-color:rgba(255,255,255,.28); }
        .btn-new-permit.portal:hover { background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5); }
        .btn-action { display:inline-block; padding:5px 10px; background:var(--occ-light); color:var(--occ); border:1px solid var(--occ-mid); border-radius:5px; font-size:11px; font-weight:700; text-decoration:none; transition:all .15s; white-space:nowrap; }
        .btn-action:hover { background:var(--occ); color:white; border-color:var(--occ); }
        .record-count-badge.occ { background:var(--occ-light); color:var(--occ); border:1px solid var(--occ-mid); }

        /* Toolbar */
        .registry-header { border-bottom:none;padding-bottom:10px; }
        .registry-header-copy h2 { font-size:16px; }
        .registry-header-copy p { color:var(--text-muted);font-size:11px;margin-top:3px; }
        .toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 24px 18px; flex-wrap:wrap; }
        .filter-tabs { display:flex; gap:4px; background:var(--surface); padding:4px; border-radius:10px; border:1px solid var(--border); flex-wrap:wrap; }
        .filter-tab { padding:7px 11px; background:transparent; border:none; border-radius:7px; font-size:11px; font-weight:700; color:var(--text-secondary); cursor:pointer; transition:all .15s; white-space:nowrap; }
        .filter-tab:hover { background:var(--white); color:var(--text-primary); }
        .filter-tab.active { background:var(--white); color:var(--occ); box-shadow:var(--shadow-sm); }
        .search-wrap { position:relative; min-width:260px; }
        .search-wrap input { min-height:40px;padding-left:34px; font-size:12px;border-radius:8px;background:#fbfcfd; }
        .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:13px; pointer-events:none; }

        /* Pills */
        .pill { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
        .pill-cleared{background:var(--occ-light);color:var(--occ);border:1px solid var(--occ-mid);}
        .pill-flagged{background:var(--red-light);color:var(--red);border:1px solid var(--red-mid);}
        .pill-eval{background:var(--amber-light);color:var(--amber);border:1px solid var(--amber-mid);}
        .pill-empty{background:var(--surface);color:var(--text-muted);border:1px solid var(--border);}

        /* Progress */
        .prog-wrap { display:flex; align-items:center; gap:8px; margin-top:5px; font-size:11px; color:var(--text-muted); }
        .prog-bg   { flex:1; height:5px; background:var(--border); border-radius:99px; overflow:hidden; }
        .prog-fill { height:100%; border-radius:99px; background:var(--occ); transition:width .4s; }
        .prog-fill.flagged { background:var(--red); }

        /* Track row */
        .status-track-row { background:var(--white); }
        .status-track-cell { padding:4px 14px 14px !important; border-bottom:1px solid var(--border) !important; }
        .status-track-container { display:inline-flex; flex-wrap:wrap; gap:8px; background:var(--surface); padding:5px 10px; border-radius:6px; border:1px solid var(--border); align-items:center; }
        .track-item { display:flex; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.03em; }
        .track-icon{font-size:13px;font-weight:800;} .icon-approved{color:var(--green);} .icon-rejected{color:var(--red);} .icon-pending{color:var(--text-muted);}
        .main-data-row:hover td { background:#f9fafb; }

        /* Modal */
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(7,26,44,.72);backdrop-filter:blur(5px); align-items:center; justify-content:center; z-index:100; padding:20px; }
        .modal-window { background:var(--white); border-radius:16px; width:100%; max-width:530px; box-shadow:0 30px 80px rgba(7,26,44,.35); overflow:hidden; }
        .modal-header { padding:19px 22px; background:var(--navy); color:white; display:flex; align-items:center; justify-content:space-between; border-bottom:4px solid var(--gold); }
        .modal-header h3 { font-family:'Libre Franklin',sans-serif;font-size:15px; font-weight:700; }
        .modal-close { background:none; border:none; color:#cbd5e1; font-size:22px; cursor:pointer; line-height:1; }
        .modal-close:hover { color:white; }
        .modal-body { padding:25px; }
        .modal-body .form-group { margin-bottom:14px; }
        .form-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .btn-cancel { padding:10px 16px; background:var(--white); color:var(--text-secondary); border:1px solid var(--border-strong); border-radius:8px; font-family:inherit;font-size:12px; font-weight:700; cursor:pointer; }
        .btn-cancel:hover { background:var(--surface); }
        .btn-submit { padding:10px 18px; background:var(--occ); color:white; border:none; border-radius:8px; font-family:inherit;font-size:12px; font-weight:700; cursor:pointer; }
        .btn-submit:hover { background:var(--occ-dark); }
        select:focus, input:focus { box-shadow:0 0 0 3px rgba(5,150,105,.12)!important; border-color:var(--occ)!important; }
        @media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr);}.top-bar{height:auto;min-height:76px;padding:12px 16px;flex-wrap:wrap}.top-bar-controls{width:100%}.btn-new-permit{flex:1;justify-content:center}.page-intro{align-items:flex-start;flex-direction:column}}
        @media(max-width:560px){.page-wrapper{padding:24px 12px 40px}.page-intro h1{font-size:24px}.page-note{display:none}.stats-row{gap:8px}.stat-card{padding:13px 12px;gap:9px}.stat-icon{width:36px;height:36px}.stat-num{font-size:20px}.toolbar{padding:8px 14px 16px}.filter-tabs{overflow-x:auto;width:100%;flex-wrap:nowrap}.search-wrap{min-width:100%;width:100%}.form-row-2{grid-template-columns:1fr}.card{border-radius:12px}}

<script>
const permitProgressViews = new Map();
    function openPermitProgress(permitId) {
        const view = permitProgressViews.get(permitId);
        if (!view) return;
        document.getElementById('progressProjectTitle').textContent = view.title;
        document.getElementById('progressSummary').textContent = view.summary;
        document.getElementById('progressContent').innerHTML = view.html;
        StationDates.loadRemarks(document.getElementById('progressContent'), 'occupancy', permitId);
        document.getElementById('permitProgressDialog').showModal();
        let recordsHost = document.getElementById('progressRecords');
        if (!recordsHost) { recordsHost = document.createElement('section'); recordsHost.id = 'progressRecords'; document.querySelector('#permitProgressDialog .progress-dialog-body').append(recordsHost); }
        recordsHost.dataset.projectRecords = 'occupancy';
        ProjectRecords.mount(recordsHost, 'occupancy', permitId);
    }


const PER_PAGE = 15;
let allPermits=[], allMatrix=[], filtered=[], currentPage=1, activeFilter='all';
const registryFilters = RegistryFilters.create({
    kind: 'occupancy', searchId: 'searchInput', statuses: ['all', 'cleared', 'eval', 'flagged', 'empty'],
    status: () => activeFilter, page: () => currentPage,
    restore: state => { activeFilter = state.status; currentPage = state.page; },
    change: () => { currentPage = 1; applyFilters(); }
});


function mdiIcon(name) { return `<svg class="mdi-icon" aria-hidden="true" focusable="false"><use href="/assets/mdi-interface-icons.svg#mdi-${name}"></use></svg>`; }
function handleLogout() { if (!FormSafety.leave()) return;
    return PermitRouting.logout();
}

// --- Auth helpers ---
function getStoredUser() { try { return JSON.parse(sessionStorage.getItem('oboUser') || 'null'); } catch(e) { return null; } }
function getAuthHeaders() {
    const user = getStoredUser();
    return { 'Content-Type': 'application/json', 'x-user-role': user?.role || '', 'x-user-id': user?.id ? String(user.id) : '' };
}

document.addEventListener('DOMContentLoaded', () => {
    const user = getStoredUser();
    if (!user) { window.location.href = '/login'; return; }

    if (!['operator','admin'].includes(user.role)) { window.location.replace(PermitRouting.home(user)); return; }

    loadData();
});

async function loadData() {
    try {
        const r = await RequestFeedback.fetch('/api/occupancy');
        const d = await r.json();
        if(r.ok===false || !Array.isArray(d.permits) || !Array.isArray(d.matrix))throw Error('Permit records could not be loaded.');
        allPermits = d.permits;
        allMatrix  = d.matrix;
        updateStats(); applyFilters();
        window.dispatchEvent(new Event('permit-registry-changed'));
    } catch(e) { console.error(e); }
}

function computeStatus(pid) {
    const rows = allMatrix.filter(m => m.occupancy_id === pid);
    if (!rows.length) return 'empty';
    if (rows.some(r => r.signature_status==='Rejected')) return 'flagged';
    if (allPermits.find(p=>p.id===pid)?.final_approval?.status === 'approved') return 'cleared';
    if (allPermits.find(p=>p.id===pid)?.final_approval?.status === 'returned') return 'flagged';
    return 'eval';
}

function updateStats() {
    document.getElementById('stTotal').textContent   = allPermits.length;
    document.getElementById('stEval').textContent    = allPermits.filter(p=>computeStatus(p.id)==='eval').length;
    document.getElementById('stCleared').textContent = allPermits.filter(p=>computeStatus(p.id)==='cleared').length;
    document.getElementById('stFlagged').textContent = allPermits.filter(p=>computeStatus(p.id)==='flagged').length;
}

function setFilter(f,btn) {
    activeFilter=f; currentPage=1;
    document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active'); applyFilters();
}

// Export the complete filtered list, not just the visible pagination slice.
window.permitExportIds = () => filtered.map(p => p.id);
function applyFilters() {
    filtered = RegistryFilters.select(allPermits, registryFilters.state(), 'occupancy', p => computeStatus(p.id));
    renderTable();
}

function renderTable() {
    const user = getStoredUser();

    const tbody = document.getElementById('permitTableBody');
    tbody.innerHTML = '';
    permitProgressViews.clear();
    PermitAging.updatePolicy(allPermits);
    const total=filtered.length, pages=Math.max(1,Math.ceil(total/PER_PAGE));
    currentPage = Math.max(1, Math.min(currentPage, pages));
    registryFilters.sync();
    const start=(currentPage-1)*PER_PAGE, slice=filtered.slice(start,start+PER_PAGE);

    document.getElementById('recordCounter').textContent=`${total} of ${allPermits.length} records`;
    document.getElementById('pgInfo').textContent = total?`Showing ${start+1}–${Math.min(start+PER_PAGE,total)} of ${total}`:'No records';
    document.getElementById('pgLabel').textContent=`Page ${currentPage} of ${pages}`;
    document.getElementById('prevBtn').disabled=currentPage<=1;
    document.getElementById('nextBtn').disabled=currentPage>=pages;

    if (!slice.length) {
        tbody.innerHTML=`<tr><td colspan="8" style="text-align:center;padding:50px;color:var(--text-muted);font-size:13px;">No records match this filter.</td></tr>`;
        return;
    }

    const pillMap = {
        cleared:`<span class="pill pill-cleared">${mdiIcon('check-circle-outline')} Finally approved</span>`,
        flagged:`<span class="pill pill-flagged">${mdiIcon('close-circle-outline')} Action needed</span>`,
        eval:`<span class="pill pill-eval">${mdiIcon('alert-circle-outline')} Evaluating</span>`,
        empty:`<span class="pill pill-empty">${mdiIcon('information-outline')} No Matrix</span>`,
    };

    slice.forEach(p => {
        const tracks=allMatrix.filter(m=>m.occupancy_id===p.id);
        const status=computeStatus(p.id);
        const approved=tracks.filter(t=>t.signature_status==='Approved').length;
        const pct=tracks.length?Math.round(approved/tracks.length*100):0;

        const deleteBtn = ['operator','admin'].includes(user?.role) ? '<button type="button" class="btn-delete-record">Delete</button>' : '';

        const mr=document.createElement('tr'); mr.className='main-data-row';
        mr.innerHTML=`
            <td class="project-id-column"><span class="project-reference">${ProjectIdentity.format('occupancy', p.id)}</span></td>
                <td><div class="occ-record-title"><img class="occ-document-icon" src="/assets/occupancy-project-icon.png" alt="" aria-hidden="true"><div><span class="project-title-main">${esc(p.project_title)}</span><span class="occ-record-owner">${esc(p.owner_name)}</span></div></div></td>
            <td class="permit-detail-text" style="font-size:12px;">${esc(p.location)}</td>
            <td><span class="lot-badge-inline">${esc(p.bp_reference_no)}</span></td>
            <td class="permit-detail-text" style="white-space:nowrap;font-size:12px;">${fmtDate(p.date_applied)}</td>
            <td>${p.final_approval ? `<span class="pill pill-${status}">${esc(p.final_approval.label)}</span>` : pillMap[status]}</td>
            <td class="permit-aging-cell">${PermitAging.cell(p.aging)}</td>
            <td style="text-align:right;">
                <div class="action-group" style="justify-content:flex-end;">
                    <button type="button" class="btn-progress" onclick="openPermitProgress(${p.id})" aria-haspopup="dialog">Progress</button>
                    <a href="/occupancy/edit?id=${p.id}" class="btn-action">Details</a>
                    ${deleteBtn}
                </div>
            </td>`;
        mr.querySelector('.btn-delete-record')?.addEventListener('click', () => deletePermit(p.id, p.project_title));
        tbody.appendChild(mr);


        let html='';
        if (tracks.length) {
            const chips=tracks.map(t=>`<div class="track-item" data-progress-station="${Number(t.id)}">${trackIcon(t.signature_status)} <span class="progress-station-name">${esc(t.discipline_name)}</span> ${StationDates.summary(t)}</div>`).join('');
            html=`<div class="route-line"><div class="route-label"><span class="badge-stream-type">Occupancy Permit</span></div><div class="status-track-container">${chips}</div></div>`;
        } else { html='<div class="route-line"><div class="route-label"><span class="badge-stream-type">Occupancy Permit</span></div><p class="progress-empty">No routing stations assigned yet.</p></div>'; }
        permitProgressViews.set(p.id, { title: p.project_title, summary: tracks.length ? approved + ' of ' + tracks.length + ' stations approved' : 'No routing matrix established', html });
    });
}

function changePage(d) { currentPage+=d; renderTable(); }
function openModal()  { if (getStoredUser()?.role !== 'operator') return; document.getElementById('createModal').style.display='flex'; }
function closeModal() { if (!FormSafety.discard('createPermitForm')) return; document.getElementById('createModal').style.display='none'; document.getElementById('createPermitForm').reset(); }

document.getElementById('createPermitForm').addEventListener('submit', FormSafety.guard('createPermitForm', async e => {
    e.preventDefault();
    if (getStoredUser()?.role !== 'operator') return;
    const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='Saving…';
    try {
        const r=await RequestFeedback.fetch('/api/occupancy',{method:'POST',headers:getAuthHeaders(),body:JSON.stringify({
            requestId:window.PermitDuplicates?.creationKey('occupancy'),
            project_title:document.getElementById('f_title').value,
            processing_time:document.getElementById('processingTime').value,
            location:document.getElementById('f_loc').value,
            owner_name:document.getElementById('f_owner').value,
            phone_number:document.getElementById('f_phone').value,
            email:document.getElementById('f_email').value,
            bp_reference_no:document.getElementById('f_bp').value,
            date_applied:document.getElementById('f_date').value
        })});
        const d=await r.json();
        if(d.cancelled)return;
        if(d.success){window.PermitDuplicates?.complete('occupancy');FormSafety.clean('createPermitForm');closeModal();await loadData();}else alert('Error: '+d.message);
    } catch(e) { RequestFeedback.report(e); }
    finally{btn.disabled=false;btn.textContent='Create permit';}
}));

async function deletePermit(id,title) {
    if (!['operator','admin'].includes(getStoredUser()?.role)) return;
    const direct = getStoredUser()?.role === 'admin';
    return DestructiveAction.run({
        title:direct?'Permanently delete permit?':'Request permit deletion?',
        message:direct?'Permanently delete “'+title+'” (Permit #'+id+') and its related records now? No admin approval request will be created.':'Request deletion of “'+title+'” (Permit #'+id+')? The permit stays available until an administrator approves its deletion.',
        confirmLabel:direct?'Delete permanently':'Request deletion',
        action:async()=>{
            const response=await RequestFeedback.fetch('/api/occupancy/'+id,{method:'DELETE',headers:getAuthHeaders(),...(direct?{body:JSON.stringify({confirmation:'DELETE'})}:{})});
            const data=await response.json();
            if(!data.success)throw new Error(data.message||'Deletion was not accepted.');
            alert(data.message||(direct?'Permit deleted.':'Deletion request submitted. The permit remains until approval.'));
            await loadData();
            window.dispatchEvent(new Event('permit-registry-changed'));
        }
    });
}

function trackIcon(s){
    const state = s === 'Approved' ? ['approved','check-circle-outline'] : s === 'Rejected' ? ['rejected','close-circle-outline'] : ['pending','alert-circle-outline'];
    return `<span class="track-icon icon-${state[0]}" title="${esc(s || 'Pending')}">${mdiIcon(state[1])}</span>`;
}
function fmtDate(d){
    if (!d) return '—';
    const dateOnly = /^\d{4}-\d{2}-\d{2}$/.test(d);
    const date = new Date(dateOnly ? d + 'T00:00:00Z' : d);
    if (!Number.isFinite(date.getTime())) return '—';
    return date.toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric',...(dateOnly ? {timeZone:'UTC'} : {})});
}
function esc(v){return v?v.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'):''; }
</script>
<script data-philippine-clock>
(() => {
    function mount() {
        if (document.querySelector('.philippine-clock')) return;
        const header = document.querySelector('.header-inner, .app-header-bar, .header-content, .office-bar, .app-header, .top-bar');
        if (!header) return;
        const style = document.createElement('style');
        style.textContent = '.philippine-clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;flex:0 0 auto;margin-left:auto;padding:7px 12px;border:0;border-radius:0;background:transparent;color:#f3f7fb;line-height:1.5;white-space:nowrap;font-family:inherit;font-variant-numeric:tabular-nums}.philippine-clock time{font-size:16px;font-weight:700;letter-spacing:.02em}.philippine-clock span{font-size:10px;color:#a9bfd2}.has-philippine-clock{gap:14px;flex-wrap:wrap;height:auto;min-height:76px}@media(max-width:600px){.philippine-clock{padding:5px 8px}.philippine-clock time{font-size:13px}.philippine-clock span{font-size:9px}}';
        document.head.append(style);
        header.classList.add('has-philippine-clock');
        const centerStyle = document.createElement('style');
        centerStyle.textContent = '.has-philippine-clock{position:relative}.has-philippine-clock .philippine-clock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;align-items:center;text-align:center}@media(max-width:1100px){.has-philippine-clock{display:flex;flex-wrap:wrap}.has-philippine-clock .philippine-clock{position:static;transform:none;flex-basis:100%;order:99;margin:8px 0;box-sizing:border-box;align-items:center}}';
        document.head.append(centerStyle);
        const clock = document.createElement('div');
        clock.className = 'philippine-clock';
        clock.setAttribute('aria-label','Philippine date and time');
        const time = document.createElement('time');
        const date = document.createElement('span');
        clock.append(time,date);
        header.append(clock);
        const tf = new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',hour:'2-digit',minute:'2-digit',second:'2-digit'});
        const df = new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',weekday:'short',year:'numeric',month:'short',day:'numeric'});
        function update(){const now=new Date();time.dateTime=now.toISOString();time.textContent=tf.format(now);date.textContent=df.format(now);}
        update();setInterval(update,1000);
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();
</script></body>
