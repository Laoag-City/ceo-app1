        .filter-tabs { max-width:650px; }

<body class="bp-page">
<div id="system-react-root" data-page="permits-index" style="display:contents"></div>
<script src="/system-react/app.js"></script>
<script>
    let globalPermitsCache = [];
    let filteredPermitsList = [];
    let currentStatusFilter = 'all';
    let currentPage = 1;
    const recordsPerPage = 5;
    const registryFilters = RegistryFilters.create({
        kind: 'building', searchId: 'dashboardSearchInput', statuses: ['all', 'pending', 'approved', 'rejected'],
        status: () => currentStatusFilter, page: () => currentPage,
        restore: state => { currentStatusFilter = state.status; currentPage = state.page; },
        change: () => { currentPage = 1; filterPermitLogs(); }
    });
    let stagedLotNumbersArray = [];
    const permitProgressViews = new Map();

    function getStoredUser() {
        try { return JSON.parse(sessionStorage.getItem('oboUser') || 'null'); } catch (e) { return null; }
    }

    function getAuthHeaders(extra = {}) {
        const user = getStoredUser();
        return {
            ...(extra || {}),
            'Content-Type': 'application/json',
            'x-user-role': user?.role || '',
            'x-user-id': user?.id ? String(user.id) : ''
        };
    }

    const currentUser = getStoredUser();
    if (!currentUser) {
        window.location.href = '/login';
    }

    function handleLogout() { if (!FormSafety.leave()) return;
        return PermitRouting.logout();
    }

    function openCreatePermitModal() {
        if (getStoredUser()?.role !== 'operator') return;
        document.getElementById('createPermitModal').style.display = 'flex';
    }

    function closeCreatePermitModal() { if (!FormSafety.discard('permitForm')) return;
        document.getElementById('createPermitModal').style.display = 'none';
        document.getElementById('permitForm').reset();
    }


    document.addEventListener('DOMContentLoaded', () => {
        getPermitLogs();
    });

    document.getElementById('permitForm').addEventListener('submit', FormSafety.guard('permitForm', async (e) => {
        e.preventDefault();
        if (getStoredUser()?.role !== 'operator') return;
        const lotVal = document.getElementById('lot_input_field').value.trim();
        const dataPayload = {
            requestId: window.PermitDuplicates?.creationKey('permits'),
            project_title: document.getElementById('project_title').value,
            sub_project_title: document.getElementById('sub_project_title').value,
            location: document.getElementById('location').value,
            owner_name: document.getElementById('owner_name').value,
            designer_name: document.getElementById('designer_name').value,
            permit_date: document.getElementById('permit_date').value,
            lot_numbers: lotVal ? [lotVal] : []
        };
        const res = await RequestFeedback.fetch('/api/permits', {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify(dataPayload)
        });
        const result=await res.json();
        if(result.cancelled)return;
        if (!res.ok || !result.success) { alert(result.message || 'Unable to create permit.'); return; }
        if (result.success) {
            window.PermitDuplicates?.complete('permits');
            FormSafety.clean('permitForm'); closeCreatePermitModal();
            stagedLotNumbersArray = [];
            getPermitLogs();
        }
    }));

    async function getPermitLogs() {
        try {
            const res = await RequestFeedback.fetch('/api/permits');
            const data=await res.json();
            if(res.ok===false || !Array.isArray(data))throw Error('Permit records could not be loaded.');
            globalPermitsCache = data;
            filterPermitLogs();
            window.dispatchEvent(new Event('permit-registry-changed'));
        } catch(e) { console.error("Fetch logs failure:", e); }
    }

    function setStatusFilter(filterType) {
        currentStatusFilter = filterType;
        document.querySelectorAll('.filter-tab').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-filter-${filterType}`).classList.add('active');
        currentPage = 1;
        filterPermitLogs();
    }

    function getBuildingPermitStatus(rowItem) {
        let subsList = [];
        try { if(rowItem.sub_permits) subsList = JSON.parse(rowItem.sub_permits) || []; } catch(e){}
        let tracks = rowItem.routing_tracks;
        if (typeof tracks === 'string') { try { tracks = JSON.parse(tracks); } catch(e) { tracks = []; } }
        if (!Array.isArray(tracks)) tracks = [];
        let unifiedTracks = [...tracks];
        subsList.forEach(s => {
            let subTracks = [];
            try { if(s.tracks) subTracks = JSON.parse(s.tracks) || []; } catch(e){}
            unifiedTracks.push(...subTracks);
        });
        let computedStatus = 'pending';
        if (unifiedTracks.length > 0) {
            const anyRejected = unifiedTracks.some(t => t && t.status && t.status.toLowerCase() === 'rejected');
            if (rowItem.final_approval?.status === 'approved') computedStatus = 'approved';
            else if (anyRejected || ['returned','correction'].includes(rowItem.final_approval?.status)) computedStatus = 'rejected';
        }
        return computedStatus;
    }

    function updateBuildingPermitSummary() {
        const permits = (globalPermitsCache || []).filter(Boolean);
        const counts = { total: permits.length, pending: 0, approved: 0, rejected: 0 };
        permits.forEach(permit => counts[getBuildingPermitStatus(permit)]++);
        Object.entries(counts).forEach(([status, count]) => {
            document.getElementById('bpSummary-' + status).textContent = count;
        });
    }

// Export the complete filtered list, not just the visible pagination slice.
window.permitExportIds = () => filteredPermitsList.map(p => p.id);
    function filterPermitLogs() {
        updateBuildingPermitSummary();
        filteredPermitsList = RegistryFilters.select(globalPermitsCache || [], registryFilters.state(), 'building', getBuildingPermitStatus);
        const maxPages = Math.ceil(filteredPermitsList.length / recordsPerPage) || 1;
        if (currentPage > maxPages) currentPage = maxPages;
        displayPaginatedRows();
    }

    function changePage(dir) { currentPage += dir; displayPaginatedRows(); }

    function formatDisplayDate(value) {
        if (!value) return '—';
        const datePart = String(value).split('T')[0];
        const match = datePart.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        return match ? `${match[3]}/${match[2]}/${match[1]}` : datePart;
    }

    function createMdiIcon(name, className = 'mdi-icon') {
        return `<svg class="${className}" aria-hidden="true" focusable="false"><use href="/assets/mdi-interface-icons.svg#mdi-${name}"></use></svg>`;
    }

    function createPendingDisciplineIcon() {
        return `<span class="track-icon icon-pending" data-icon="mdi:alert-circle-outline" title="Pending review">${createMdiIcon('alert-circle-outline')}</span>`;
    }

    function createDisciplineIcon(status) {
        if (!status) return createPendingDisciplineIcon();
        const n = status.toString().toLowerCase();
        if (n === 'approved') return `<span class="track-icon icon-approved">${createMdiIcon('check-circle-outline')}</span>`;
        if (n === 'rejected') return `<span class="track-icon icon-rejected">${createMdiIcon('close-circle-outline')}</span>`;
        return createPendingDisciplineIcon();
    }

    function openPermitProgress(permitId) {
        const view = permitProgressViews.get(permitId);
        if (!view) return;
        document.getElementById('progressProjectTitle').textContent = view.title;
        document.getElementById('progressSummary').textContent = view.summary;
        document.getElementById('progressContent').innerHTML = view.html;
        StationDates.loadRemarks(document.getElementById('progressContent'), 'permits', permitId);
        document.getElementById('permitProgressDialog').showModal();
        let recordsHost = document.getElementById('progressRecords');
        if (!recordsHost) { recordsHost = document.createElement('section'); recordsHost.id = 'progressRecords'; document.querySelector('#permitProgressDialog .progress-dialog-body').append(recordsHost); }
        recordsHost.dataset.projectRecords = 'permits';
        ProjectRecords.mount(recordsHost, 'permits', permitId);
    }

    function displayPaginatedRows() {
        const tableBody = document.getElementById('permitTableBody');
        const pageIndicator = document.getElementById('paginationPageIndicator');
        tableBody.innerHTML = '';
        permitProgressViews.clear();
        PermitAging.updatePolicy(globalPermitsCache || []);
        const totalPages = Math.ceil(filteredPermitsList.length / recordsPerPage) || 1;
        currentPage = Math.max(1, Math.min(currentPage, totalPages));
        registryFilters.sync();
        pageIndicator.innerText = `Page ${currentPage} of ${totalPages}`;
        document.getElementById('btnPrevPage').disabled = (currentPage === 1);
        document.getElementById('btnNextPage').disabled = (currentPage === totalPages);
        document.getElementById('recordCounter').innerText = `${filteredPermitsList.length} of ${globalPermitsCache.length} records`;

        if (filteredPermitsList.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-muted);font-size:13px;">No matching permit records found.</td></tr>`;
            return;
        }

        const subset = filteredPermitsList.slice((currentPage - 1) * recordsPerPage, currentPage * recordsPerPage);
        subset.forEach(rowItem => {
            const formattedDate = formatDisplayDate(rowItem.permit_date);
            let subsList = [];
            try { if(rowItem.sub_permits) subsList = JSON.parse(rowItem.sub_permits) || []; } catch(e){}
            let lotsList = [];
            try { if(rowItem.lot_numbers) lotsList = JSON.parse(rowItem.lot_numbers) || []; } catch(e){}

            let parentTracks = [];
            try { if (rowItem.routing_tracks) parentTracks = JSON.parse(rowItem.routing_tracks) || []; } catch(e){}
            const allTracks = [...parentTracks];
            subsList.forEach(s => {
                let subTracks = [];
                try { if (s.tracks) subTracks = JSON.parse(s.tracks) || []; } catch(e){}
                allTracks.push(...subTracks);
            });

            const approvedCount = allTracks.filter(t => t && t.status && t.status.toLowerCase() === 'approved').length;
            const hasRejected = allTracks.some(t => t && t.status && t.status.toLowerCase() === 'rejected');
            const permitStatus = rowItem.final_approval?.status === 'approved' ? 'approved' : (['returned','correction'].includes(rowItem.final_approval?.status) || hasRejected ? 'rejected' : 'pending');
            const statusLabel = rowItem.final_approval?.label || (permitStatus === 'rejected' ? 'Action needed' : 'In review');
            const progressLabel = allTracks.length ? `${approvedCount} of ${allTracks.length} stations approved` : 'No routing stations configured';


            let subSummaryHtml = '';
            if (subsList.length === 1) subSummaryHtml = `<div class="sub-title-row"><span class="sub-label">SUB</span><span>${escapeInputHTML(subsList[0].title)}</span></div>`;
            else if (subsList.length > 1) subSummaryHtml = `<div class="sub-title-row"><span class="sub-label">SUB</span><span>${subsList.length} sub-permits</span></div>`;

            const titleHtml = `<div class="permit-heading">
                <img class="bp-project-icon" src="/assets/building-project-icon.png" alt="" aria-hidden="true">
                <div class="permit-heading-copy">
                    <div class="permit-title-line"><span class="project-title-main">${escapeInputHTML(rowItem.project_title)}</span></div>
                    <div class="permit-progress-summary">${progressLabel}</div>
                    ${subSummaryHtml}
                </div>
            </div>`;

            let lotsHtml = lotsList.map(lot => `<span class="lot-badge-inline">${escapeInputHTML(lot)}</span>`).join('');
            if (lotsList.length === 0) lotsHtml = '<em style="color:var(--text-muted);">—</em>';

            const dataRow = document.createElement('tr');
            dataRow.id = `permit-summary-${rowItem.id}`;
            dataRow.className = 'main-data-row permit-group-row';
            dataRow.innerHTML = `
                <td class="project-id-column"><span class="project-reference">${ProjectIdentity.format('building', rowItem.id)}</span></td>
                <td>${titleHtml}</td>
                <td class="permit-detail-text">${escapeInputHTML(rowItem.location)}</td>
                <td class="permit-detail-text">${escapeInputHTML(rowItem.owner_name)}</td>
                <td class="permit-detail-text" style="white-space:nowrap;">${formattedDate}</td>
                <td><div style="display:flex;flex-wrap:wrap;gap:2px;max-width:180px;">${lotsHtml}</div></td>
                <td><span class="permit-status-chip permit-status-${permitStatus}">${statusLabel}</span></td>
                <td class="permit-aging-cell">${PermitAging.cell(rowItem.aging)}</td>
                <td>
                    <div class="action-group">
                        <button type="button" class="btn-progress" onclick="openPermitProgress(${rowItem.id})" aria-haspopup="dialog">Progress</button>
                        <a class="btn-details" href="/edit?id=${rowItem.id}">Details</a>
                        ${['operator','admin'].includes(currentUser?.role) ? '<button type="button" class="btn-delete-record">Delete</button>' : ''}
                    </div>
                </td>
            `;
            dataRow.querySelector('.btn-delete-record')?.addEventListener('click', () => executePermitRemoval(rowItem.id, rowItem.project_title));
            tableBody.appendChild(dataRow);

            let htmlStreams = `<div class="wrapper-stream-box">`;

            let parentItemsHtml = parentTracks.map(t => `
                <div class="track-item" data-progress-station="${Number(t.id)}">${createDisciplineIcon(t.status)} <span class="progress-station-name">${escapeInputHTML(t.discipline)}</span> ${StationDates.summary(t)}</div>
            `).join('');
            if (parentTracks.length === 0) parentItemsHtml = '<div style="grid-column: 1 / -1;"><em style="font-size:11px; color:var(--text-muted);">No routing stations assigned.</em></div>';
            
            htmlStreams += `<div class="route-line route-line-main">
                <div class="route-label"><span class="badge-stream-type">Main permit</span></div>
                <div class="route-stations">${parentItemsHtml}</div>
            </div>`;

            subsList.forEach(s => {
                let subTracks = [];
                try { if(s.tracks) subTracks = JSON.parse(s.tracks) || []; } catch(e){}
                let subItemsHtml = subTracks.map(t => `
                    <div class="track-item" data-progress-station="${Number(t.id)}">${createDisciplineIcon(t.status)} <span class="progress-station-name">${escapeInputHTML(t.discipline)}</span> ${StationDates.summary(t)}</div>
                `).join('');
                if (subTracks.length === 0) subItemsHtml = '<div style="grid-column: 1 / -1;"><em style="font-size:11px;color:var(--text-muted);">No stations.</em></div>';
                
                htmlStreams += `<div class="route-line route-line-sub">
                    <div class="route-label"><span class="badge-stream-sub">Sub: ${escapeInputHTML(s.title)}</span></div>
                    <div class="route-stations">${subItemsHtml}</div>
                </div>`;
            });

            htmlStreams += `</div>`;
            permitProgressViews.set(rowItem.id, { title: rowItem.project_title, summary: progressLabel, html: htmlStreams });
        });
    }

    async function executePermitRemoval(id,title) {
    if (!['operator','admin'].includes(getStoredUser()?.role)) return;
    const direct = getStoredUser()?.role === 'admin';
    return DestructiveAction.run({
        title:direct?'Permanently delete permit?':'Request permit deletion?',
        message:direct?'Permanently delete “'+title+'” (Permit #'+id+') and its related records now? No admin approval request will be created.':'Request deletion of “'+title+'” (Permit #'+id+')? The permit stays available until an administrator approves its deletion.',
        confirmLabel:direct?'Delete permanently':'Request deletion',
        action:async()=>{
            const response=await RequestFeedback.fetch('/api/permits/'+id,{method:'DELETE',headers:getAuthHeaders(),...(direct?{body:JSON.stringify({confirmation:'DELETE'})}:{})});
            const data=await response.json();
            if(!data.success)throw new Error(data.message||'Deletion was not accepted.');
            alert(data.message||(direct?'Permit deleted.':'Deletion request submitted. The permit remains until approval.'));
            await getPermitLogs();
            window.dispatchEvent(new Event('permit-registry-changed'));
        }
    });
}

    function escapeInputHTML(val) {
        return val ? val.toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") : '';
    }
</script>
<script data-philippine-clock>
(() => {
    function mount() {
        if (document.querySelector('.philippine-clock')) return;
        const header = document.querySelector('.header-inner, .app-header-bar, .header-content, .office-bar, .app-header, .top-bar');
        if (!header) return;
        const style = document.createElement('style');
        style.textContent = '.philippine-clock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;flex:0 0 auto;margin-left:auto;padding:7px 12px;border:0;border-radius:0;background:transparent;color:#f3f7fb;line-height:1.5;white-space:nowrap;font-family:inherit;font-variant-numeric:tabular-nums}.philippine-clock time{font-size:16px;font-weight:700;letter-spacing:.02em}.philippine-clock span{font-size:10px;color:#a9bfd2}.has-philippine-clock{gap:14px;flex-wrap:wrap;height:auto;min-height:76px}@media(max-width:600px){.philippine-clock{padding:5px 8px}.philippine-clock time{font-size:13px}.philippine-clock span{font-size:9px}}';
        document.head.append(style);
        header.classList.add('has-philippine-clock');
        const centerStyle = document.createElement('style');
        centerStyle.textContent = '.has-philippine-clock{position:relative}.has-philippine-clock .philippine-clock{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;align-items:center;text-align:center}@media(max-width:1100px){.has-philippine-clock{display:flex;flex-wrap:wrap}.has-philippine-clock .philippine-clock{position:static;transform:none;flex-basis:100%;order:99;margin:8px 0;box-sizing:border-box;align-items:center}}';
        document.head.append(centerStyle);
        const clock = document.createElement('div');
        clock.className = 'philippine-clock';
        clock.setAttribute('aria-label','Philippine date and time');
        const time = document.createElement('time');
        const date = document.createElement('span');
        clock.append(time,date);
        header.append(clock);
        const tf = new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',hour:'2-digit',minute:'2-digit',second:'2-digit'});
        const df = new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',weekday:'short',year:'numeric',month:'short',day:'numeric'});
        function update(){const now=new Date();time.dateTime=now.toISOString();time.textContent=tf.format(now);date.textContent=df.format(now);}
        update();setInterval(update,1000);
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();
</script></body>
</html>
