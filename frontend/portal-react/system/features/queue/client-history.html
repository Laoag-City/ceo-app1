<!DOCTYPE html>
<html lang="en">
<head>
    <!-- React mounts the layout before the search controller. Edit this source, then publish:system. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client History — Office of the City Engineer</title>
    <script src="/appearance.js"></script>
    <script src="/request-feedback.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kiosk-style.css">
    <link rel="stylesheet" href="queue-ui.css">
    <link rel="stylesheet" href="shared-header.css">
    <link rel="stylesheet" href="/appearance.css">
    <link rel="stylesheet" href="/queue-workspace.css">
</head>
<body class="queue-admin-page client-history-page">
<div id="system-react-root" data-page="queue-client-history" style="display:contents"></div>
<script src="/system-react/app.js"></script>
<script data-client-history>
(() => {
    const byId = id => document.getElementById(id);
    const form = byId('historySearchForm'), search = byId('historySearch');
    const body = byId('historyTableBody'), results = byId('historyResults');
    const count = byId('historyCount'), feedback = byId('historyFeedback');
    const previous = byId('historyPrevious'), next = byId('historyNext');
    let page = 1, totalPages = 1, query = '', generation = 0, pending = false;
    const pageSize = 20;
    const dateFormatter = new Intl.DateTimeFormat('en-PH', {timeZone:'Asia/Manila', year:'numeric', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});
    const statuses = {waiting:'Waiting', holding:'On hold', serving:'In service', completed:'Completed', dropped:'Dropped'};
    const windows = {PC1:'Window 1', PC2:'Window 2', PC3:'Window 3'};

    function cell(row, value, className) {
        const td = document.createElement('td');
        td.textContent = value || '—';
        if (className) td.className = className;
        row.append(td);
        return td;
    }
    function message(text) {
        const tr = document.createElement('tr'), td = cell(tr, text, 'history-empty');
        td.colSpan = 7;
        body.replaceChildren(tr);
    }
    function render(rows) {
        if (!rows.length) return message(query ? 'No clients match your search. Try another name, address, ticket ID, or phone number.' : 'No client records yet. Registered visits will appear here.');
        const fragment = document.createDocumentFragment();
        rows.forEach(record => {
            const tr = document.createElement('tr');
            cell(tr, record.ticketId, 'history-ticket');
            cell(tr, record.name, 'history-client');
            cell(tr, record.phone, 'history-phone');
            cell(tr, record.barangay, 'history-address');
            const service = cell(tr, record.reason, 'history-service');
            if (windows[record.called_by]) {
                const detail = document.createElement('small');
                detail.textContent = windows[record.called_by];
                service.append(detail);
            }
            const statusCell = cell(tr, ''), badge = document.createElement('span');
            badge.className = 'history-status history-status-' + (Object.hasOwn(statuses, record.status) ? record.status : 'unknown');
            badge.textContent = statuses[record.status] || 'Unknown';
            statusCell.replaceChildren(badge);
            const date = new Date(record.created_at);
            cell(tr, record.created_at && !Number.isNaN(date.getTime()) ? dateFormatter.format(date) : '—', 'history-date');
            fragment.append(tr);
        });
        body.replaceChildren(fragment);
    }
    function updateControls() {
        previous.disabled = pending || page <= 1;
        next.disabled = pending || page >= totalPages;
        byId('historyRefresh').disabled = pending;
        byId('historyClear').hidden = !search.value && !query;
        results.setAttribute('aria-busy', String(pending));
    }
    async function load(requestedPage = 1) {
        const current = ++generation;
        pending = true;
        feedback.hidden = true;
        count.textContent = 'Loading records…';
        message('Loading client records…');
        updateControls();
        try {
            const params = new URLSearchParams({q:query, page:String(requestedPage), pageSize:String(pageSize)});
            const response = await RequestFeedback.fetch('/api/client-history?' + params);
            const data = await response.json();
            if (current !== generation) return;
            if (!data.success || !Array.isArray(data.rows) || !data.pagination) throw new Error(data.message || 'Could not load client records.');
            page = data.pagination.page;
            totalPages = Math.max(1, data.pagination.totalPages);
            const total = data.pagination.total;
            render(data.rows);
            count.textContent = total.toLocaleString() + (total === 1 ? ' visit' : ' visits') + (query ? ' found' : ' recorded');
            byId('historyPage').textContent = 'Page ' + page + ' of ' + totalPages;
            const start = total ? (page - 1) * pageSize + 1 : 0;
            byId('historyRange').textContent = total ? 'Showing ' + start + '–' + (start + data.rows.length - 1) + ' of ' + total.toLocaleString() + ' visits · Check dates when ticket numbers repeat.' : 'Registered visits stay in this log after a queue reset.';
        } catch (error) {
            if (current !== generation) return;
            message('Client records could not be loaded. Use Refresh to try again.');
            feedback.textContent = error.message || 'Could not load client records. Please try again.';
            feedback.hidden = false;
            count.textContent = 'Records unavailable';
            totalPages = 1;
            byId('historyPage').textContent = 'Page —';
            byId('historyRange').textContent = '';
        } finally {
            if (current === generation) {pending = false; updateControls();}
        }
    }
    form.addEventListener('submit', event => {event.preventDefault(); query = search.value.trim(); page = 1; load();});
    search.addEventListener('input', updateControls);
    byId('historyClear').addEventListener('click', () => {search.value = ''; query = ''; page = 1; search.focus(); load();});
    byId('historyRefresh').addEventListener('click', () => load(page));
    previous.addEventListener('click', () => {if (!pending && page > 1) load(page - 1);});
    next.addEventListener('click', () => {if (!pending && page < totalPages) load(page + 1);});
    load();
})();
</script>
<script data-philippine-clock>
(() => {
    const header = document.querySelector('.site-header');
    const clock = document.createElement('div');
    clock.className = 'philippine-clock';
    clock.setAttribute('aria-label', 'Philippine date and time');
    const time = document.createElement('time'), date = document.createElement('span');
    clock.append(time, date);
    header.append(clock);
    const tf = new Intl.DateTimeFormat('en-PH', {timeZone:'Asia/Manila', hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const df = new Intl.DateTimeFormat('en-PH', {timeZone:'Asia/Manila', weekday:'short', year:'numeric', month:'short', day:'numeric'});
    function update() {const now = new Date(); time.dateTime = now.toISOString(); time.textContent = tf.format(now); date.textContent = df.format(now);}
    update(); setInterval(update, 1000);
})();
</script>
</body>
</html>
