<!DOCTYPE html>
<html lang="en">
<head>
    <!-- React mounts the layout before the search controller. Edit this source, then publish:system. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Summary — Office of the City Engineer</title>
    <script src="/appearance.js"></script>
    <script src="/request-feedback.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kiosk-style.css">
    <link rel="stylesheet" href="queue-ui.css">
    <link rel="stylesheet" href="shared-header.css">
    <link rel="stylesheet" href="/appearance.css">
    <link rel="stylesheet" href="/queue-workspace.css">
</head>
<body class="queue-admin-page client-history-page">
<div id="system-react-root" data-page="queue-client-history" style="display:contents"></div>
<script src="/system-react/app.js"></script>
<script data-client-history>
(() => {
    const byId = id => document.getElementById(id);
    const form = byId('historySearchForm');
    const from = byId('historyFrom'), to = byId('historyTo');
    const body = byId('historyTableBody'), feedback = byId('historyFeedback');
    const refresh = byId('historyRefresh'), apply = form.querySelector('button');
    const parts = new Intl.DateTimeFormat('en-US', {timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const datePart = type => parts.find(part => part.type === type).value;
    from.value = to.value = [datePart('year'),datePart('month'),datePart('day')].join('-');
    let generation = 0;
    async function load() {
        const current = ++generation;
        refresh.disabled = apply.disabled = true;
        feedback.hidden = true;
        byId('historyResults').setAttribute('aria-busy','true');
        try {
            if (!from.value || !to.value || from.value > to.value) throw new Error('Choose a valid date range.');
            const response = await RequestFeedback.fetch('/api/client-history?' + new URLSearchParams({from:from.value,to:to.value}));
            const data = await response.json();
            if (current !== generation) return;
            if (response.ok === false || !data.success || !Array.isArray(data.services)) throw new Error(data.message || 'Service counts could not be loaded.');
            const rows = data.services.map(item => {
                const row = document.createElement('tr');
                for (const value of [item.service, Number(item.count).toLocaleString()]) {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    row.append(cell);
                }
                return row;
            });
            body.replaceChildren(...rows);
            byId('historyCount').textContent = Number(data.total).toLocaleString();
        } catch (error) {
            if (current !== generation) return;
            body.replaceChildren();
            byId('historyCount').textContent = 'Unavailable';
            feedback.textContent = error.message || 'Use Refresh to retry.';
            feedback.hidden = false;
        } finally {
            if (current === generation) {
                refresh.disabled = apply.disabled = false;
                byId('historyResults').setAttribute('aria-busy','false');
            }
        }
    }
    form.addEventListener('submit', event => {event.preventDefault(); load();});
    refresh.addEventListener('click', load);
    load();
})();
</script>
<script data-philippine-clock>
(() => {
    const header = document.querySelector('.site-header');
    const clock = document.createElement('div');
    clock.className = 'philippine-clock';
    clock.setAttribute('aria-label', 'Philippine date and time');
    const time = document.createElement('time'), date = document.createElement('span');
    clock.append(time, date);
    header.append(clock);
    const tf = new Intl.DateTimeFormat('en-PH', {timeZone:'Asia/Manila', hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const df = new Intl.DateTimeFormat('en-PH', {timeZone:'Asia/Manila', weekday:'short', year:'numeric', month:'short', day:'numeric'});
    function update() {const now = new Date(); time.dateTime = now.toISOString(); time.textContent = tf.format(now); date.textContent = df.format(now);}
    update(); setInterval(update, 1000);
})();
</script>
</body>
</html>
