<!DOCTYPE html>
<html lang="en">
<head>
    <!-- React mounts once before the playlist controller. Edit this source, then publish:system. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Playlist — Office of the City Engineer</title>
    <script src="/appearance.js"></script>
    <script src="/request-feedback.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="kiosk-style.css">
    <link rel="stylesheet" href="queue-ui.css">
    <link rel="stylesheet" href="shared-header.css">
    <link rel="stylesheet" href="status-badges.css">
    <link rel="stylesheet" href="/appearance.css">
    <link rel="stylesheet" href="/queue-workspace.css">
</head>
<body class="queue-admin-page media-page">
<div id="system-react-root" data-page="queue-secret-management" style="display:contents"></div>
<script src="/system-react/app.js"></script>
<script data-video-playlist>
(() => {
    const byId = id => document.getElementById(id);
    const form = byId('videoUploadForm'), input = byId('fileInput'), dropzone = byId('dropzone');
    const rows = byId('playlistRows'), feedback = byId('playlistFeedback');
    const dialog = byId('playlistPreview'), preview = byId('playlistPreviewVideo');
    const dates = new Intl.DateTimeFormat('en-PH', {timeZone:'Asia/Manila', dateStyle:'medium'});
    let videos = [], selected = null, busy = false, loading = false, generation = 0, loaded = false;

    function notice(text, kind = 'error') {
        feedback.textContent = text;
        feedback.dataset.kind = kind;
        feedback.hidden = !text;
    }
    function message(text) {
        const item = document.createElement('li');
        item.className = 'playlist-empty';
        item.textContent = text;
        rows.replaceChildren(item);
    }
    function controls() {
        byId('playlistRefresh').disabled = busy;
        byId('playlistUpload').disabled = busy || !selected;
        byId('playlistBrowse').disabled = busy;
        input.disabled = busy;
        rows.setAttribute('aria-busy', String(busy || loading));
        rows.querySelectorAll('button').forEach(button => {button.disabled = busy || button.dataset.unavailable === 'true';});
    }
    function action(label, name, id, unavailable, className = '') {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'playlist-button ' + className;
        button.textContent = label;
        button.dataset.action = name;
        button.dataset.id = String(id);
        button.dataset.unavailable = String(!!unavailable);
        button.disabled = !!unavailable;
        return button;
    }
    function render() {
        if (!videos.length) return message('No videos yet. Upload a clip to start the monitor playlist.');
        const fragment = document.createDocumentFragment();
        videos.forEach((video, index) => {
            const item = document.createElement('li'), number = document.createElement('span'), content = document.createElement('div');
            item.className = 'playlist-row'; number.className = 'playlist-number'; number.textContent = String(index + 1);
            const heading = document.createElement('div'), title = document.createElement('h4'), badge = document.createElement('span');
            heading.className = 'playlist-row-header'; title.textContent = video.name;
            badge.className = 'playlist-state' + (video.active ? '' : ' is-disabled');
            badge.textContent = video.active ? 'Enabled' : 'Disabled';
            heading.append(title, badge);
            const detail = document.createElement('p'), date = new Date(video.uploadedAt);
            detail.textContent = video.uploadedAt && !Number.isNaN(date.getTime()) ? 'Uploaded ' + dates.format(date) : 'Monitor video';
            const actions = document.createElement('div'); actions.className = 'playlist-row-actions';
            const previewButton = action('Preview', 'preview', video.id, !video.available);
            const up = action('↑ Up', 'up', video.id, index === 0), down = action('↓ Down', 'down', video.id, index === videos.length - 1);
            up.setAttribute('aria-label', 'Move ' + video.name + ' up'); down.setAttribute('aria-label', 'Move ' + video.name + ' down');
            const toggle = action(video.active ? 'Disable' : 'Enable', 'toggle', video.id, false, 'playlist-toggle');
            toggle.setAttribute('aria-label', (video.active ? 'Disable ' : 'Enable ') + video.name);
            actions.append(previewButton, up, down, toggle); content.append(heading, detail);
            if (!video.available) {
                const missing = document.createElement('p'); missing.className = 'playlist-missing';
                missing.textContent = 'File unavailable. The monitor skips this video; upload it again if needed.';
                content.append(missing);
            }
            content.append(actions); item.append(number, content); fragment.append(item);
        });
        rows.replaceChildren(fragment);
    }
    async function load(silent = false) {
        const request = ++generation;
        loading = true; controls();
        try {
            const response = await RequestFeedback.fetch('/api/videos/manage');
            const data = await response.json();
            if (request !== generation) return;
            if (response.ok === false || !data.success || !Array.isArray(data.videos)) throw Error(data.message || 'Could not load the playlist.');
            videos = data.videos; loaded = true;
            byId('playlistStaff').textContent = data.user?.displayName || 'Staff workspace';
            byId('playlistAuditLink').hidden = !['admin', 'superadmin'].includes(data.user?.role);
            const active = videos.filter(video => video.active && video.available).length;
            byId('playlistCount').textContent = active + ' ready to play · ' + videos.length + (videos.length === 1 ? ' video' : ' videos');
            render();
            if (!silent) notice('');
            return true;
        } catch (error) {
            if (request !== generation) return;
            if (!loaded) message('The playlist could not be loaded. Use Refresh to try again.');
            byId('playlistCount').textContent = 'Playlist unavailable';
            notice(error.message || 'Could not load the playlist.');
        } finally { if (request === generation) {loading = false; controls();} }
    }
    function choose(file) {
        if (busy) return;
        if (!file) {selected = null; byId('fileSelectedFeedback').hidden = true; controls(); return;}
        if (!/\.(mp4|webm|mov|m4v)$/i.test(file.name) || (file.type && !file.type.startsWith('video/')) || file.size > 100000000) {
            selected = null; input.value = ''; byId('fileSelectedFeedback').hidden = true;
            notice('Choose an MP4, WebM, MOV or M4V video smaller than 100 MB.'); controls(); return;
        }
        selected = file; byId('fileNameSpan').textContent = file.name; byId('fileSelectedFeedback').hidden = false; notice(''); controls();
    }
    async function mutate(url, options, success) {
        if (busy) return;
        busy = true; loading = false; ++generation; controls(); notice('');
        try {
            const response = await RequestFeedback.fetch(url, options);
            const data = await response.json();
            if (response.ok === false || !data.success) throw Error(data.message || 'The playlist could not be updated.');
            if (url.endsWith('/upload')) {form.reset(); selected = null; byId('fileSelectedFeedback').hidden = true;}
            if (await load(true)) notice(success, 'success');
        } catch (error) { notice(error.message || 'The playlist could not be updated. Please try again.'); }
        finally {busy = false; byId('playlistUpload').querySelector('span').textContent = 'Upload video'; controls();}
    }
    byId('playlistBrowse').addEventListener('click', () => input.click());
    input.addEventListener('change', () => choose(input.files[0]));
    dropzone.addEventListener('dragover', event => {event.preventDefault(); if (!busy) dropzone.classList.add('is-dragging');});
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('is-dragging'));
    dropzone.addEventListener('drop', event => {event.preventDefault(); dropzone.classList.remove('is-dragging'); choose(event.dataTransfer.files[0]);});
    form.addEventListener('submit', event => {
        event.preventDefault(); if (busy) return;
        if (!selected) {notice('Choose a video to upload first.'); return;}
        const data = new FormData(); data.append('videoFile', selected);
        byId('playlistUpload').querySelector('span').textContent = 'Uploading…';
        mutate('/api/videos/upload', {method:'POST', headers:{'x-queue-request':'1'}, body:data}, 'Video uploaded and added to the end of the playlist.');
    });
    rows.addEventListener('click', event => {
        const button = event.target.closest('button[data-action]');
        if (!button || button.disabled || busy) return;
        const video = videos.find(item => item.id === Number(button.dataset.id)); if (!video) return;
        const action = button.dataset.action;
        if (action === 'preview') {
            byId('playlistPreviewTitle').textContent = video.name; byId('playlistPreviewError').hidden = true;
            preview.src = video.url; dialog.showModal(); return;
        }
        const toggle = action === 'toggle', payload = toggle ? {active:!video.active} : {direction:action};
        mutate('/api/videos/' + video.id + (toggle ? '/active' : '/move'), {method:'POST', headers:{'Content-Type':'application/json', 'x-queue-request':'1'}, body:JSON.stringify(payload)}, toggle ? 'Video ' + (video.active ? 'disabled.' : 'enabled.') : 'Video order updated.');
    });
    function clearPreview() {preview.pause(); preview.removeAttribute('src'); preview.load();}
    dialog.addEventListener('close', clearPreview);
    byId('playlistPreviewClose').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {if (event.target === dialog) {const box = dialog.getBoundingClientRect(); if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) dialog.close();}});
    preview.addEventListener('error', () => {byId('playlistPreviewError').hidden = false;});
    byId('playlistRefresh').addEventListener('click', () => {if (!busy) load();});
    window.addEventListener('focus', () => {if (!busy && loaded) load(true);});
    setInterval(() => {if (!busy && loaded && document.visibilityState === 'visible') load(true);}, 30000);
    controls(); load();
})();
</script>
<script data-philippine-clock>
(() => {
    const header = document.querySelector('.site-header'), clock = document.createElement('div');
    clock.className = 'philippine-clock'; clock.setAttribute('aria-label', 'Philippine date and time');
    const time = document.createElement('time'), date = document.createElement('span'); clock.append(time, date); header.append(clock);
    const tf = new Intl.DateTimeFormat('en-PH', {timeZone:'Asia/Manila', hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const df = new Intl.DateTimeFormat('en-PH', {timeZone:'Asia/Manila', weekday:'short', year:'numeric', month:'short', day:'numeric'});
    function update() {const now = new Date(); time.dateTime = now.toISOString(); time.textContent = tf.format(now); date.textContent = df.format(now);}
    update(); setInterval(update, 1000);
})();
</script>
</body>
</html>
