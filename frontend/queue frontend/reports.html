<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Queue Reports — Office of the City Engineer</title>
 <script src="/appearance.js"></script><script src="/request-feedback.js"></script>
 <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="kiosk-style.css"><link rel="stylesheet" href="queue-ui.css"><link rel="stylesheet" href="shared-header.css"><link rel="stylesheet" href="/appearance.css"><link rel="stylesheet" href="/queue-workspace.css">
</head>
<body class="queue-admin-page queue-reports-page">
<div id="system-react-root" data-page="queue-reports" style="display:contents"></div>
<script src="/system-react/app.js"></script>
<script data-queue-reports>
(() => {
 const byId = id => document.getElementById(id);
 const form = byId('reportFilters'), results = byId('reportResults'), feedback = byId('reportFeedback');
 const metrics = ['registered','completed','dropped','waiting','holding','serving'];
 const windows = {PC1:'Window 1',PC2:'Window 2',PC3:'Window 3'};
 const dayFormat = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'});
 const dateLabel = date => new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',month:'short',day:'numeric',year:'numeric'}).format(new Date(date+'T00:00:00+08:00'));
 const clockFormat = new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',dateStyle:'medium',timeStyle:'short'});
 const localDate = date => {const parts=dayFormat.formatToParts(date);return ['year','month','day'].map(type=>parts.find(part=>part.type===type).value).join('-');};
 const today = localDate(new Date());
 byId('reportTo').value = today;
 const week = new Date(today+'T00:00:00+08:00');week.setUTCDate(week.getUTCDate()-6);
 byId('reportFrom').value = localDate(week);
 let generation = 0, pending = false, report = null;
 const number = value => Number.isFinite(Number(value)) ? Math.max(0,Number(value)) : 0;
 const count = value => number(value).toLocaleString('en-PH');
 function duration(value) {
  if(value===null || value===undefined || !Number.isFinite(Number(value)))return 'Unavailable';
  const seconds = Math.round(number(value));
  if(seconds<60)return seconds+' sec';
  if(seconds<3600)return Math.floor(seconds/60)+' min '+(seconds%60)+' sec';
  return Math.floor(seconds/3600)+' hr '+Math.floor(seconds%3600/60)+' min';
 }
 function controls() {
  results.setAttribute('aria-busy',String(pending));
  byId('reportRefresh').disabled = pending;
  byId('reportApply').disabled = pending;
  byId('reportExport').disabled = pending || !report;
  byId('reportPrint').disabled = pending || !report;
 }
 function cell(row,value) {const td=document.createElement('td');td.textContent=String(value);row.append(td);}
 function table(id,rows,values,columns) {
  const body=byId(id),fragment=document.createDocumentFragment();
  rows.forEach(item=>{const tr=document.createElement('tr');values(item).forEach(value=>cell(tr,value));fragment.append(tr);});
  if(!rows.length){const tr=document.createElement('tr');cell(tr,'No visits match these filters.');tr.firstChild.colSpan=columns;fragment.append(tr);}
  body.replaceChildren(fragment);
 }
 function render(data) {
  const filters=data.filters,summary=data.summary;
  const windowLabel=windows[filters.window] || 'All windows';
  byId('reportPeriod').textContent=dateLabel(filters.from)+' – '+dateLabel(filters.to)+' · '+windowLabel+' · '+(filters.service || 'All services');
  metrics.forEach(key=>byId('report-'+key).textContent=count(summary[key]));
  byId('reportWait').textContent=duration(summary.averageWaitSeconds);
  byId('reportDuration').textContent=duration(summary.averageServiceSeconds);
  const coverage=data.timingCoverage || {};
  byId('reportCoverage').textContent='Wait time: '+count(coverage.waitMeasured)+' measured visits. Service time: '+count(coverage.serviceMeasured)+' measured finished visits. Earlier visits without recorded timestamps are excluded.';
  table('reportDailyRows',data.daily,item=>[dateLabel(item.date),count(item.registered),count(item.completed),count(item.dropped)],4);
  table('reportWindowRows',data.windows,item=>[windows[item.window] || item.label || 'Unassigned',...metrics.map(key=>count(item[key])),duration(item.averageWaitSeconds),duration(item.averageServiceSeconds)],9);
  const chart=byId('reportChart'),fragment=document.createDocumentFragment();
  results.classList.toggle('report-long-period',data.daily.length>31);
  const maximum=Math.max(1,...data.daily.flatMap(day=>[number(day.registered),number(day.completed)]));
  if(!number(summary.registered)){
   const empty=document.createElement('p');empty.className='report-chart-empty';empty.textContent='No registered visits in this period.';fragment.append(empty);
  }else data.daily.forEach(day=>{
   const group=document.createElement('div');group.className='report-chart-group';group.title=dateLabel(day.date)+': '+count(day.registered)+' registered, '+count(day.completed)+' finished';
   const bars=document.createElement('div');bars.className='report-chart-bars';
   ['registered','completed'].forEach(key=>{const bar=document.createElement('span');bar.className='report-chart-bar'+(key==='completed'?' finished':'');bar.style.height=(number(day[key])/maximum*140)+'px';bars.append(bar);});
   const label=document.createElement('small');label.textContent=day.date.slice(5);group.append(bars,label);fragment.append(group);
  });
  chart.replaceChildren(fragment);
  chart.setAttribute('aria-label','Daily visits: '+count(summary.registered)+' registered and '+count(summary.completed)+' finished. Exact daily totals are available below.');
  byId('reportUpdated').textContent='Retrieved '+clockFormat.format(new Date())+' (Asia/Manila). Counts include archived visits and current saved statuses.';
 }
 async function load() {
  if(!form.reportValidity())return;
  const filters=Object.fromEntries(new FormData(form));
  if(filters.from>filters.to){feedback.hidden=false;feedback.textContent='Choose an end date on or after the start date.';return;}
  const current=++generation;
  pending=true;report=null;feedback.hidden=true;results.hidden=false;
  byId('reportPeriod').textContent='Loading report…';controls();
  try {
   const response=await RequestFeedback.fetch('/api/reports?'+new URLSearchParams(filters),{cache:'no-store'});
   const data=await response.json();
   if(current!==generation)return;
   if(!response.ok || !data.success || !data.summary || !data.filters || !Array.isArray(data.daily) || !Array.isArray(data.windows))throw Error(data.message || 'Could not load this report.');
   render(data);report=data;
  }catch(error){
   if(current!==generation)return;
   results.hidden=true;feedback.hidden=false;feedback.textContent=error.message || 'Could not load this report. Please try again.';
  }finally{if(current===generation){pending=false;controls();}}
 }
 function csvCell(value) {
  let text=String(value===null || value===undefined ? 'Unavailable' : value);
  if(/^[=+@\-\t\r]/.test(text))text="'"+text;
  return '"'+text.replace(/"/g,'""')+'"';
 }
 function exportCSV() {
  if(!report || pending)return;
  const data=report,rows=[['Queue report'],['Registered from',data.filters.from],['Registered to',data.filters.to],['Time zone','Asia/Manila'],['Window',windows[data.filters.window] || 'All windows'],['Service',data.filters.service || 'All services'],[],['Metric','Total'],...metrics.map(key=>[key==='completed'?'Finished':key,data.summary[key]]),['Average wait (seconds)',data.summary.averageWaitSeconds],['Average service (seconds)',data.summary.averageServiceSeconds],['Measured wait visits',data.timingCoverage?.waitMeasured || 0],['Measured finished visits',data.timingCoverage?.serviceMeasured || 0],[],['Date','Registered','Finished','Dropped'],...data.daily.map(day=>[day.date,day.registered,day.completed,day.dropped]),[],['Window','Registered','Finished','Dropped','Waiting','On hold','In service','Average wait (seconds)','Average service (seconds)'],...data.windows.map(item=>[windows[item.window] || item.label,...metrics.map(key=>item[key]),item.averageWaitSeconds,item.averageServiceSeconds]),[],['Statuses reflect latest saved outcomes for visits registered in the date range. Held time is excluded from service averages. Earlier visits without timing are excluded.']];
  const blob=new Blob(['\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='queue-report-'+data.filters.from+'-to-'+data.filters.to+'.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 }
 form.addEventListener('submit',event=>{event.preventDefault();load();});
 byId('reportRefresh').addEventListener('click',load);
 byId('reportExport').addEventListener('click',exportCSV);
 byId('reportPrint').addEventListener('click',()=>{if(report && !pending)window.print();});
 // Keep service and window filters independent: past visits may have been
 // served at a window whose current service assignments have changed.
 load();
})();
</script>
</body>
</html>
